name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      # Solo lettura: il deploy esce da Cloudflare Pages via API, niente viene
      # più scritto su un branch di questo repo.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Storia completa: le date git (lastmod sitemap, datePublished dei
          # TechArticle) e il diff del ping IndexNow la richiedono
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Italiano rimasto nelle pagine inglesi: blocca, perché finisce sotto
      # gli occhi di un lettore e di un crawler.
      - name: Lingua delle pagine inglesi
        run: npm run i18n:lint

      # L'inglese rimasto indietro rispetto all'italiano: solo avviso. Il
      # difetto è reale ma lo è anche il registro dimenticato, e un deploy
      # fermo perché manca un `i18n:sync` non aiuta nessuno.
      - name: Traduzioni indietro
        continue-on-error: true
        run: npm run i18n:drift

      - name: Build
        run: npm run build

      # La vera 404 (con noindex) arriva già da public/ via Vite: niente più
      # copia di index.html su 404.html, che serviva la homepage intera come
      # pagina di errore. Da public/ escono anche _headers (CSP, HSTS) e
      # _redirects (i 301 delle URL di prima dello spostamento del 29/07/2026):
      # entrambi li legge Cloudflare Pages e nessun altro, ed è il motivo per
      # cui non esiste più un mirror di riserva altrove — servirebbe le pagine
      # senza nessuna delle due cose.

      - name: Deploy su Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch esplicito: senza, wrangler deduce il ramo dall'ambiente CI
          # e un deploy di produzione rischia di finire come preview
          command: pages deploy dist --project-name=codedge --branch=main

      - name: IndexNow ping (pagine cambiate in questo push)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -Eq '^0+$' || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "Commit di partenza non disponibile: invio tutta la sitemap"
            node scripts/indexnow-ping.mjs --all
            exit 0
          fi
          # I file, non le URL: la conversione la fa lo script, che ha la mappa.
          ROUTES=$(git diff --name-only "$BEFORE" "$AFTER" -- pages/ | grep 'index\.html$' | sort -u)
          if [ -n "$ROUTES" ]; then
            node scripts/indexnow-ping.mjs $ROUTES
          else
            echo "Nessuna pagina cambiata in questo push: niente ping IndexNow"
          fi
