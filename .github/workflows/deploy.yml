name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      # Read only: the deploy leaves from Cloudflare Pages over the API, and
      # nothing is written back to a branch of this repo any more.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Full history: the git dates (sitemap lastmod, datePublished on the
          # TechArticles) and the IndexNow diff both need it
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The tests cover the logic that runs without a DOM: the extractor's
      # colour conversions, the route map (which hreflang, the sitemap and the
      # 301s all come out of), the split of pages into units that i18n-drift
      # works on, the Italian detector below, and the components' runtime
      # strings. They block: if one of these gives way the site still builds,
      # and the damage gets found by a reader or a crawler rather than by the
      # build.
      - name: Test
        run: npm test

      # The test count the README advertises. Typed by hand it is right once and
      # wrong from the next commit on, so this fails the build when the badge
      # and the suite disagree.
      - name: Test-count badge
        run: npm run badge:check

      # Italian left in the English pages: blocks, because it lands in front of
      # a reader and a crawler.
      - name: Language of the English pages
        run: npm run i18n:lint

      # English left behind its Italian counterpart: warning only. The defect is
      # real, but so is the forgotten changelog, and a deploy held up by a
      # missing `i18n:sync` helps nobody.
      - name: Translations lagging behind
        continue-on-error: true
        run: npm run i18n:drift

      - name: Build
        run: npm run build

      # Everything above this line runs without a browser, and the site is a
      # browser. These checks drive a real Chrome over dist/ — what ships, not
      # the dev server — and block: a page that never produces a contentful
      # paint, a module that throws on load, a tool that stops extracting, a
      # guide that only lays out once JavaScript has run. Each of those has
      # reached the live site at least once while the build stayed green.
      #
      # Chrome comes with the runner image. If it ever stops coming, this step
      # fails loudly naming the paths it tried, which is the right outcome:
      # deploying without having opened the site is the thing to avoid.
      - name: Smoke test in a browser
        run: npm run test:smoke

      # The real 404 (with noindex) already arrives from public/ through Vite:
      # no more copying index.html over 404.html, which served the whole
      # homepage as an error page. public/ is also where _headers (CSP, HSTS)
      # and _redirects come from (the 301s for the URLs from before the move of
      # 29 July 2026): Cloudflare Pages reads both and nobody else does, which
      # is why there is no longer a standby mirror anywhere — it would serve the
      # pages with neither of those two things.

      # wrangler sits in devDependencies on purpose, not by accident: without it
      # the action downloads it on the fly on every push, and on 3 August 2026
      # the deploy failed on its own because @cloudflare/workerd-linux-64, one
      # of its optional dependencies, had not arrived. From the lockfile it
      # comes with every binary and always at the same version. The action
      # detects it and skips the download — but only for as long as
      # `wranglerVersion` does NOT appear below: specify it and the action goes
      # back to installing wrangler by itself.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch spelled out: without it wrangler infers the branch from the
          # CI environment, and a production deploy risks landing as a preview
          command: pages deploy dist --project-name=codedge --branch=main

      - name: IndexNow ping (pages changed in this push)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -Eq '^0+$' || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "Starting commit not available: sending the whole sitemap"
            node scripts/indexnow-ping.mjs --all
            exit 0
          fi
          # The files, not the URLs: the script does the conversion, it has the map.
          ROUTES=$(git diff --name-only "$BEFORE" "$AFTER" -- pages/ | grep 'index\.html$' | sort -u)
          if [ -n "$ROUTES" ]; then
            node scripts/indexnow-ping.mjs $ROUTES
          else
            echo "No page changed in this push: no IndexNow ping"
          fi
