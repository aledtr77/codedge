name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      # contents: write serve ancora al deploy gh-pages di riserva, che resta
      # attivo finché il DNS non è stabile su Cloudflare (vedi step in fondo)
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Storia completa: le date git (lastmod sitemap, datePublished dei
          # TechArticle) e il diff del ping IndexNow la richiedono
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # La vera 404 (con noindex) arriva già da public/ via Vite: niente più
      # copia di index.html su 404.html, che serviva la homepage intera come
      # pagina di errore. public/_headers, inerte su GitHub Pages, su
      # Cloudflare Pages diventa la fonte reale di CSP, HSTS e affini.

      - name: Deploy su Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch esplicito: senza, wrangler deduce il ramo dall'ambiente CI
          # e un deploy di produzione rischia di finire come preview
          command: pages deploy dist --project-name=codedge --branch=main

      # RISERVA TEMPORANEA — da togliere a cutover finito (vedi PROMEMORIA).
      # Finché codedge.it può tornare su GitHub Pages con un rollback DNS, il
      # branch gh-pages deve restare aggiornato: un rollback verso contenuto
      # fermo a settimane prima sarebbe peggio del problema che risolve.
      - name: Mirror su gh-pages (rollback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: IndexNow ping (pagine cambiate in questo push)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -Eq '^0+$' || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "Commit di partenza non disponibile: invio tutta la sitemap"
            node scripts/indexnow-ping.mjs --all
            exit 0
          fi
          ROUTES=$(git diff --name-only "$BEFORE" "$AFTER" -- pages/ | grep 'index\.html$' | sed 's|^pages||; s|index\.html$||' | sort -u)
          if [ -n "$ROUTES" ]; then
            node scripts/indexnow-ping.mjs $ROUTES
          else
            echo "Nessuna pagina cambiata in questo push: niente ping IndexNow"
          fi
