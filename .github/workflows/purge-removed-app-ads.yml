name: Purge removed app ads file

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge cached app-ads.txt
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_response=$(curl -fsS \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=codedge.it')
          zone_id=$(jq -r '.result[0].id // empty' <<< "$zone_response")
          if [ -z "$zone_id" ]; then
            echo 'The token cannot read the codedge.it zone.' >&2
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"files":["https://codedge.it/app-ads.txt"]}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" \
            | jq -e '.success == true' >/dev/null
