name: "🐛 Report a bug"
description: "Something on Codedge is not working the way it should."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking a minute to report it. 🙏
        The more detail you add, the faster it gets fixed.
  - type: input
    id: page_url
    attributes:
      label: "Page affected"
      description: "URL or title of the page where you found the problem."
      placeholder: "https://codedge.it/tutorial/..."
    validations:
      required: false
  - type: textarea
    id: what_happened
    attributes:
      label: "What happened?"
      description: "Describe the problem, and what you expected to happen instead."
      placeholder: "At the end of the quiz the two buttons appear side by side and overlapping, instead of one at a time..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "How to reproduce it (optional)"
      description: "The steps that bring the problem back."
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. The problem shows up here
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: "Device and browser (optional)"
      placeholder: "e.g. Samsung S25 Ultra + Chrome / iPhone + Safari / Windows desktop + Firefox"
    validations:
      required: false
