name: "💡 Suggest an improvement"
description: "An idea for making Codedge more useful, clearer or more complete."
title: "[Improvement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Every idea is welcome, however small. ✨
  - type: input
    id: page_url
    attributes:
      label: "Page or section (optional)"
      description: "Where your suggestion applies, if it is about one specific part of the site."
      placeholder: "https://codedge.it/..."
    validations:
      required: false
  - type: textarea
    id: suggestion
    attributes:
      label: "Your suggestion"
      description: "What you would improve, and why you think it would help."
    validations:
      required: true
