<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Event Loop in JavaScript</title>
  <desc id="desc">Visualizzazione del ciclo di esecuzione asincrono: Call Stack, Web APIs, Callback Queue ed Event Loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.55" stop-color="#0c263d"/>
      <stop offset="1" stop-color="#0f1d2d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163c5d"/>
      <stop offset="1" stop-color="#0b2035"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020812" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>

  <!-- Left: Call Stack (1D stack) -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="260" height="300" rx="18" fill="url(#card)" stroke="#66d9ff" stroke-opacity="0.4" stroke-width="2"/>
    <text x="210" y="115" fill="#66d9ff" font-family="Verdana" font-size="18" font-weight="700" text-anchor="middle">CALL STACK</text>
    
    <!-- Stack Frames -->
    <rect x="100" y="140" width="220" height="45" rx="8" fill="#1e4e79" stroke="#7cf5c4" stroke-opacity="0.5" stroke-width="2"/>
    <text x="210" y="168" fill="#7cf5c4" font-family="Consolas, monospace" font-size="14" text-anchor="middle">calcolaTasse()</text>
    
    <rect x="100" y="195" width="220" height="45" rx="8" fill="#1e4e79" stroke="#66d9ff" stroke-opacity="0.4"/>
    <text x="210" y="223" fill="#e2f5ff" font-family="Consolas, monospace" font-size="14" text-anchor="middle">elaboraOrdine()</text>

    <rect x="100" y="250" width="220" height="45" rx="8" fill="#1e4e79" stroke="#66d9ff" stroke-opacity="0.4"/>
    <text x="210" y="278" fill="#e2f5ff" font-family="Consolas, monospace" font-size="14" text-anchor="middle">main()</text>
  </g>

  <!-- Center-Right: Web APIs (delegated browser tasks) -->
  <g filter="url(#shadow)">
    <rect x="860" y="80" width="260" height="130" rx="18" fill="url(#card)" stroke="#66d9ff" stroke-opacity="0.4" stroke-width="2"/>
    <text x="990" y="115" fill="#66d9ff" font-family="Verdana" font-size="18" font-weight="700" text-anchor="middle">WEB APIs (Browser)</text>
    
    <rect x="880" y="135" width="220" height="50" rx="8" fill="#0b2035" stroke="#e5c158" stroke-opacity="0.4"/>
    <text x="990" y="165" fill="#e5c158" font-family="Consolas, monospace" font-size="14" text-anchor="middle">setTimeout(..., 2000)</text>
  </g>

  <!-- Bottom: Callback Queue -->
  <g filter="url(#shadow)">
    <rect x="420" y="250" width="360" height="130" rx="18" fill="url(#card)" stroke="#66d9ff" stroke-opacity="0.4" stroke-width="2"/>
    <text x="600" y="285" fill="#66d9ff" font-family="Verdana" font-size="18" font-weight="700" text-anchor="middle">CALLBACK QUEUE</text>
    
    <!-- Queue Items -->
    <rect x="440" y="305" width="150" height="50" rx="8" fill="#0e3a2f" stroke="#7cf5c4" stroke-width="2"/>
    <text x="515" y="335" fill="#7cf5c4" font-family="Consolas, monospace" font-size="13" text-anchor="middle">onClickCallback()</text>

    <rect x="610" y="305" width="150" height="50" rx="8" fill="#1e4e79" stroke="#66d9ff" stroke-opacity="0.5"/>
    <text x="685" y="335" fill="#e2f5ff" font-family="Consolas, monospace" font-size="13" text-anchor="middle">onTimerDone()</text>
  </g>

  <!-- Circular Event Loop indicator in the center -->
  <g stroke="#7cf5c4" fill="none" stroke-linecap="round">
    <!-- Spinning circle -->
    <path d="M570 160 a 30 30 0 1 1 -5 -15" stroke-width="4" stroke-dasharray="120,30"/>
    <path d="M565 140 l 10 5 -5 10" stroke-width="4" fill="none"/>
    <text x="600" y="165" fill="#7cf5c4" font-family="Verdana" font-size="14" font-weight="700" stroke="none">EVENT LOOP</text>
  </g>

  <!-- Flow arrows -->
  <!-- Web API to Queue -->
  <path d="M990 220v110h-160" stroke="#e5c158" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M840 325l-10 5 10 5" stroke="#e5c158" stroke-width="3" fill="none"/>

  <!-- Queue to Stack (through Loop) -->
  <path d="M420 330h-30" stroke="#7cf5c4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M390 330v-40" stroke="#7cf5c4" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Titles and explanations -->
  <g font-family="Verdana, Arial, sans-serif" text-anchor="middle" fill="#b8ddf4">
    <text x="600" y="445" font-size="22" font-weight="700">L'asincronia in JavaScript: l'Event Loop</text>
    <text x="600" y="475" font-size="15">Lo stack esegue il codice. Le API del browser attendono in background, ed il loop invia le risposte allo stack appena è vuoto.</text>
  </g>
</svg>
