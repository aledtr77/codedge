<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Manipolazione del DOM con JavaScript</title>
  <desc id="desc">Schema di come il codice JavaScript interagisce e modifica dinamicamente gli elementi HTML della pagina.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.55" stop-color="#0c263d"/>
      <stop offset="1" stop-color="#0f1d2d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163c5d"/>
      <stop offset="1" stop-color="#0b2035"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020812" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>

  <!-- Left: JavaScript File Editor Mockup -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="460" height="300" rx="18" fill="url(#card)" stroke="#66d9ff" stroke-opacity="0.4" stroke-width="2"/>
    <!-- Window header -->
    <path d="M80 120h460" stroke="#66d9ff" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="110" cy="100" r="6" fill="#ff5f56"/>
    <circle cx="130" cy="100" r="6" fill="#ffbd2e"/>
    <circle cx="150" cy="100" r="6" fill="#27c93f"/>
    <text x="280" y="105" fill="#a0c1d6" font-family="Verdana" font-size="14" font-weight="700">app.js</text>

    <!-- Code Content -->
    <g font-family="Consolas, Monaco, monospace" font-size="15" fill="#f4fbff">
      <text x="110" y="160" fill="#a0c1d6">// 1. Seleziona l'elemento</text>
      <text x="110" y="190"><tspan fill="#e5c158">const</tspan> pulsante = document.<tspan fill="#66d9ff">querySelector</tspan>(<tspan fill="#7cf5c4">'.btn'</tspan>);</text>
      <text x="110" y="220"><tspan fill="#e5c158">const</tspan> scatola = document.<tspan fill="#66d9ff">querySelector</tspan>(<tspan fill="#7cf5c4">'.box'</tspan>);</text>
      
      <text x="110" y="260" fill="#a0c1d6">// 2. Modifica al click</text>
      <text x="110" y="290">pulsante.<tspan fill="#66d9ff">addEventListener</tspan>(<tspan fill="#7cf5c4">'click'</tspan>, () => {</text>
      <text x="130" y="320">scatola.style.background = <tspan fill="#7cf5c4">'#7cf5c4'</tspan>;</text>
      <text x="130" y="350">scatola.textContent = <tspan fill="#7cf5c4">'Fatto!'</tspan>;</text>
      <text x="110" y="375">});</text>
    </g>
  </g>

  <!-- Right: Browser Window Mockup -->
  <g filter="url(#shadow)">
    <rect x="660" y="80" width="460" height="300" rx="18" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.4" stroke-width="2"/>
    <!-- Window header -->
    <path d="M660 120h460" stroke="#7cf5c4" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="690" cy="100" r="6" fill="#888"/>
    <circle cx="710" cy="100" r="6" fill="#888"/>
    <circle cx="730" cy="100" r="6" fill="#888"/>
    <rect x="760" y="90" width="320" height="20" rx="6" fill="#163c5d" stroke="#66d9ff" stroke-opacity="0.2"/>
    <text x="920" y="104" fill="#a0c1d6" font-family="Verdana" font-size="12" text-anchor="middle">https://localhost:3000</text>

    <!-- Page Content Preview -->
    <!-- Button -->
    <rect x="720" y="160" width="160" height="40" rx="8" fill="#1e4e79" stroke="#66d9ff" stroke-width="2"/>
    <text x="800" y="185" fill="#f4fbff" font-family="Verdana" font-size="14" font-weight="700" text-anchor="middle">Clicca qui</text>
    
    <!-- Target Box -->
    <rect x="720" y="230" width="340" height="100" rx="12" fill="#163c5d" stroke="#66d9ff" stroke-dasharray="4,4" stroke-width="2"/>
    <text x="890" y="285" fill="#66d9ff" font-family="Verdana" font-size="18" font-weight="700" text-anchor="middle">Contenuto iniziale</text>
  </g>

  <!-- Glowing Action Arrow -->
  <path d="M550 250h100" stroke="url(#bg)" stroke-width="4" stroke-linecap="round"/>
  <!-- Curved line showing interaction -->
  <path d="M530 320c80 0 80-60 180-60" fill="none" stroke="#7cf5c4" stroke-width="3" stroke-dasharray="6,6"/>
  <path d="M705 255l8 5-8 5" fill="none" stroke="#7cf5c4" stroke-width="3"/>

  <!-- Titles and explanations -->
  <g font-family="Verdana, Arial, sans-serif" text-anchor="middle" fill="#b8ddf4">
    <text x="600" y="445" font-size="22" font-weight="700">La Manipolazione del DOM (Document Object Model)</text>
    <text x="600" y="475" font-size="15">JavaScript intercetta le azioni dell'utente (come i click) e modifica all'istante l'HTML e lo stile CSS a schermo.</text>
  </g>
</svg>
