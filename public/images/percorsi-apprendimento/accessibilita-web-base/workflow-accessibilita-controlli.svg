<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Workflow controlli accessibilita</title>
  <desc id="desc">Routine di controllo accessibilita: struttura, tastiera, contrasto, form, mobile e test finale.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a2b"/>
      <stop offset="1" stop-color="#0c2639"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143d5c"/>
      <stop offset="1" stop-color="#0a1d30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74d4ff"/>
      <stop offset="1" stop-color="#8df4c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020812" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <path d="M72 86h1056M72 414h1056" stroke="#91dfff" stroke-opacity="0.13"/>
  <text x="600" y="64" text-anchor="middle" fill="#f5fbff" font-family="Verdana, Arial, sans-serif" font-size="32" font-weight="700">Routine minima di controllo</text>

  <g filter="url(#shadow)">
    <rect x="70" y="142" width="160" height="184" rx="18" fill="url(#panel)" stroke="#86ddff" stroke-opacity="0.34"/>
    <rect x="266" y="142" width="160" height="184" rx="18" fill="url(#panel)" stroke="#86ddff" stroke-opacity="0.34"/>
    <rect x="462" y="142" width="160" height="184" rx="18" fill="url(#panel)" stroke="#86ddff" stroke-opacity="0.34"/>
    <rect x="658" y="142" width="160" height="184" rx="18" fill="url(#panel)" stroke="#86ddff" stroke-opacity="0.34"/>
    <rect x="854" y="142" width="160" height="184" rx="18" fill="url(#panel)" stroke="#86ddff" stroke-opacity="0.34"/>
    <rect x="1050" y="142" width="90" height="184" rx="18" fill="#0a1d30" stroke="#8df4c9" stroke-opacity="0.45"/>
  </g>

  <g fill="none" stroke="#a8ecff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 205h52M124 229h52M124 253h38"/>
    <path d="M322 206h42M322 230h42M309 206l-10 10-7-7M309 230l-10 10-7-7"/>
    <rect x="520" y="204" width="44" height="44" rx="8"/>
    <path d="M510 264h64"/>
    <path d="M720 204h36M707 228h62M720 252h36"/>
    <path d="M914 200h40M914 224h40M914 248h28"/>
    <circle cx="1095" cy="228" r="30"/>
    <path d="M1081 228l10 10 22-26"/>
  </g>

  <g font-family="Verdana, Arial, sans-serif">
    <text x="150" y="180" text-anchor="middle" fill="#f4fbff" font-size="19" font-weight="700">Struttura</text>
    <text x="150" y="358" text-anchor="middle" fill="#c5ecff" font-size="15">heading</text>
    <text x="150" y="381" text-anchor="middle" fill="#c5ecff" font-size="15">landmark</text>

    <text x="346" y="180" text-anchor="middle" fill="#f4fbff" font-size="19" font-weight="700">Tastiera</text>
    <text x="346" y="358" text-anchor="middle" fill="#c5ecff" font-size="15">Tab, Enter</text>
    <text x="346" y="381" text-anchor="middle" fill="#c5ecff" font-size="15">focus visibile</text>

    <text x="542" y="180" text-anchor="middle" fill="#f4fbff" font-size="19" font-weight="700">Contrasto</text>
    <text x="542" y="358" text-anchor="middle" fill="#c5ecff" font-size="15">testo leggibile</text>
    <text x="542" y="381" text-anchor="middle" fill="#c5ecff" font-size="15">stati chiari</text>

    <text x="738" y="180" text-anchor="middle" fill="#f4fbff" font-size="19" font-weight="700">Form</text>
    <text x="738" y="358" text-anchor="middle" fill="#c5ecff" font-size="15">label</text>
    <text x="738" y="381" text-anchor="middle" fill="#c5ecff" font-size="15">errori utili</text>

    <text x="934" y="180" text-anchor="middle" fill="#f4fbff" font-size="19" font-weight="700">Mobile</text>
    <text x="934" y="358" text-anchor="middle" fill="#c5ecff" font-size="15">tocchi comodi</text>
    <text x="934" y="381" text-anchor="middle" fill="#c5ecff" font-size="15">layout stabile</text>

    <text x="1095" y="358" text-anchor="middle" fill="#d8fff0" font-size="16" font-weight="700">Test</text>
    <text x="1095" y="381" text-anchor="middle" fill="#d8fff0" font-size="14">prima live</text>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 233h18"/>
    <path d="M248 225l9 8-9 8"/>
    <path d="M434 233h18"/>
    <path d="M444 225l9 8-9 8"/>
    <path d="M630 233h18"/>
    <path d="M640 225l9 8-9 8"/>
    <path d="M826 233h18"/>
    <path d="M836 225l9 8-9 8"/>
    <path d="M1022 233h18"/>
    <path d="M1032 225l9 8-9 8"/>
  </g>

  <text x="600" y="448" text-anchor="middle" fill="#b8ddf4" font-family="Verdana, Arial, sans-serif" font-size="18">Non serve aspettare il progetto perfetto: pochi controlli ripetuti bene evitano molti problemi reali.</text>
</svg>
