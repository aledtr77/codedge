<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Workflow di Sviluppo con AI</title>
  <desc id="desc">Confronto tra workflow sragionato (copia-incolla cieco) e workflow solido (revisione critica ed integrazione controllata).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.55" stop-color="#0c263d"/>
      <stop offset="1" stop-color="#0f1d2d"/>
    </linearGradient>
    <linearGradient id="card-correct" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a2f"/>
      <stop offset="1" stop-color="#051c16"/>
    </linearGradient>
    <linearGradient id="card-wrong" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d181d"/>
      <stop offset="1" stop-color="#1f090c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020812" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>

  <!-- Left: Sragionato (Wrong Workflow) -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="480" height="300" rx="18" fill="url(#card-wrong)" stroke="#ff6b6b" stroke-opacity="0.4" stroke-width="2"/>
    <text x="320" y="115" fill="#ff6b6b" font-family="Verdana" font-size="18" font-weight="700" text-anchor="middle">WORKFLOW SRAGIONATO (Cieco)</text>
    
    <!-- Steps -->
    <rect x="120" y="140" width="400" height="40" rx="8" fill="#1f090c" stroke="#ff6b6b" stroke-opacity="0.3"/>
    <text x="320" y="165" fill="#fccacf" font-family="Verdana" font-size="14" text-anchor="middle">1. Copia un errore immenso o chiedi codice vago</text>

    <rect x="120" y="195" width="400" height="40" rx="8" fill="#1f090c" stroke="#ff6b6b" stroke-opacity="0.3"/>
    <text x="320" y="220" fill="#fccacf" font-family="Verdana" font-size="14" text-anchor="middle">2. Genera intere cartelle o file enormi di codice</text>

    <rect x="120" y="250" width="400" height="40" rx="8" fill="#1f090c" stroke="#ff6b6b" stroke-opacity="0.3"/>
    <text x="320" y="275" fill="#fccacf" font-family="Verdana" font-size="14" text-anchor="middle">3. Copia/incolla diretto nel tuo file senza rileggere</text>

    <rect x="120" y="305" width="400" height="45" rx="8" fill="#ff6b6b" fill-opacity="0.15" stroke="#ff6b6b" stroke-width="2"/>
    <text x="320" y="332" fill="#ff8b8b" font-family="Verdana" font-size="14" font-weight="700" text-anchor="middle">RISULTATO: Bug latenti o blocchi in compilazione</text>
  </g>

  <!-- Right: Solido (Correct Workflow) -->
  <g filter="url(#shadow)">
    <rect x="640" y="80" width="480" height="300" rx="18" fill="url(#card-correct)" stroke="#7cf5c4" stroke-opacity="0.4" stroke-width="2"/>
    <text x="880" y="115" fill="#7cf5c4" font-family="Verdana" font-size="18" font-weight="700" text-anchor="middle">WORKFLOW ASSISTITO (Solido)</text>
    
    <!-- Steps -->
    <rect x="680" y="140" width="400" height="40" rx="8" fill="#051c16" stroke="#7cf5c4" stroke-opacity="0.3"/>
    <text x="880" y="165" fill="#d8fff0" font-family="Verdana" font-size="14" text-anchor="middle">1. Isola il problema reale e fornisci contesto</text>

    <rect x="680" y="195" width="400" height="40" rx="8" fill="#051c16" stroke="#7cf5c4" stroke-opacity="0.3"/>
    <text x="880" y="220" fill="#d8fff0" font-family="Verdana" font-size="14" text-anchor="middle">2. Chiedi blocchi piccoli ed imponi vincoli chiari</text>

    <rect x="680" y="250" width="400" height="40" rx="8" fill="#051c16" stroke="#7cf5c4" stroke-opacity="0.3"/>
    <text x="880" y="275" fill="#d8fff0" font-family="Verdana" font-size="14" text-anchor="middle">3. Leggi riga per riga, comprendi e testa il codice</text>

    <rect x="680" y="305" width="400" height="45" rx="8" fill="#7cf5c4" fill-opacity="0.15" stroke="#7cf5c4" stroke-width="2"/>
    <text x="880" y="332" fill="#9effd7" font-family="Verdana" font-size="14" font-weight="700" text-anchor="middle">RISULTATO: Codice pulito, controllo totale del progetto</text>
  </g>

  <!-- Titles and explanations -->
  <g font-family="Verdana, Arial, sans-serif" text-anchor="middle" fill="#b8ddf4">
    <text x="600" y="445" font-size="22" font-weight="700">Integrazione dell'AI nello sviluppo software</text>
    <text x="600" y="475" font-size="15">L'intelligenza artificiale accelera il lavoro ripetitivo, ma la guida logica, la revisione ed i test appartengono sempre a te.</text>
  </g>
</svg>
