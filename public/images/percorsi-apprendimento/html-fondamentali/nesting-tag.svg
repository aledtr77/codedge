<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Annidamento dei Tag (Tag Nesting)</title>
  <desc id="desc">Confronto tra annidamento corretto (scatole contenute l'una nell'altra) e scorretto (scatole incrociate).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.55" stop-color="#0c263d"/>
      <stop offset="1" stop-color="#0f1d2d"/>
    </linearGradient>
    <linearGradient id="card-correct" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a2f"/>
      <stop offset="1" stop-color="#051c16"/>
    </linearGradient>
    <linearGradient id="card-wrong" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d181d"/>
      <stop offset="1" stop-color="#1f090c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020812" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>

  <!-- Left: Correct Nesting -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="480" height="300" rx="18" fill="url(#card-correct)" stroke="#7cf5c4" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="120" y="140" width="400" height="200" rx="12" fill="#0b2035" stroke="#66d9ff" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="160" y="200" width="320" height="100" rx="8" fill="#163c5d" stroke="#e5c158" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- Right: Incorrect Nesting (Crossed) -->
  <g filter="url(#shadow)">
    <rect x="640" y="80" width="480" height="300" rx="18" fill="url(#card-wrong)" stroke="#ff6b6b" stroke-opacity="0.4" stroke-width="2"/>
    
    <!-- Crossed boxes visualization -->
    <rect x="680" y="140" width="340" height="200" rx="12" fill="#0b2035" stroke="#66d9ff" stroke-opacity="0.5" stroke-dasharray="6,6" stroke-width="2"/>
    <rect x="780" y="200" width="300" height="100" rx="8" fill="#1d1d2d" stroke="#ff6b6b" stroke-opacity="0.7" stroke-width="2"/>
  </g>

  <!-- Text and labels for Left (Correct) -->
  <g font-family="Consolas, Monaco, 'Andale Mono', monospace" font-size="16" fill="#f4fbff">
    <!-- Parent box -->
    <text x="100" y="115" fill="#7cf5c4" font-weight="700">&lt;div class="card"&gt;</text>
    <!-- Child box 1 -->
    <text x="140" y="175" fill="#66d9ff">&lt;p&gt;</text>
    <!-- Child box 2 -->
    <text x="180" y="235" fill="#e5c158">&lt;strong&gt;</text>
    <text x="200" y="265" fill="#ffffff" font-size="14">Testo in grassetto</text>
    <text x="380" y="285" fill="#e5c158">&lt;/strong&gt;</text>
    <!-- Close Child box 1 -->
    <text x="440" y="325" fill="#66d9ff">&lt;/p&gt;</text>
    <!-- Close Parent box -->
    <text x="470" y="365" fill="#7cf5c4" font-weight="700">&lt;/div&gt;</text>
  </g>

  <!-- Text and labels for Right (Incorrect) -->
  <g font-family="Consolas, Monaco, 'Andale Mono', monospace" font-size="16" fill="#f4fbff">
    <text x="660" y="115" fill="#ff6b6b" font-weight="700">&lt;p&gt;</text>
    <text x="700" y="175" fill="#66d9ff">&lt;strong&gt;</text>
    <text x="800" y="235" fill="#ffffff" font-size="14">Incrocio errato dei tag!</text>
    <!-- Wrongly closed tags order -->
    <text x="700" y="325" fill="#ff6b6b" font-weight="700">&lt;/p&gt; (Errore!)</text>
    <text x="920" y="285" fill="#66d9ff">&lt;/strong&gt;</text>
  </g>

  <!-- Titles and explanations -->
  <g font-family="Verdana, Arial, sans-serif" text-anchor="middle">
    <!-- Left Footer -->
    <text x="320" y="445" fill="#7cf5c4" font-size="20" font-weight="700">CORRETTO (Scatole cinesi)</text>
    <text x="320" y="475" fill="#bfeaff" font-size="14">L'ultimo tag aperto è il primo ad essere chiuso.</text>

    <!-- Right Footer -->
    <text x="880" y="445" fill="#ff6b6b" font-size="20" font-weight="700">ERRATO (Tag incrociati)</text>
    <text x="880" y="475" fill="#fccacf" font-size="14">I tag non si chiudono nell'ordine giusto e si sovrappongono.</text>
  </g>
</svg>
