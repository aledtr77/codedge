<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Struttura Semantica (Semantic Layout)</title>
  <desc id="desc">Schema di una pagina divisa in header, nav, main con article e aside, e footer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.55" stop-color="#0c263d"/>
      <stop offset="1" stop-color="#0f1d2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66d9ff"/>
      <stop offset="1" stop-color="#7cf5c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020812" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>

  <!-- Webpage Canvas Outline -->
  <rect x="230" y="30" width="740" height="390" rx="16" fill="#091424" stroke="url(#accent)" stroke-opacity="0.3" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Browser Chrome dots -->
  <circle cx="255" cy="48" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="270" cy="48" r="5" fill="#f59e42" opacity="0.8"/>
  <circle cx="285" cy="48" r="5" fill="#10b981" opacity="0.8"/>

  <!-- Layout Elements -->
  <!-- <header> -->
  <rect x="250" y="70" width="700" height="60" rx="10" fill="#163c5d" stroke="#66d9ff" stroke-opacity="0.6" stroke-width="2"/>
  
  <!-- <nav> inside header -->
  <rect x="680" y="80" width="250" height="40" rx="6" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.5"/>

  <!-- <main> -->
  <rect x="250" y="145" width="480" height="200" rx="10" fill="#163c5d" stroke="#66d9ff" stroke-opacity="0.6" stroke-width="2"/>
  
  <!-- <article> inside main -->
  <rect x="270" y="185" width="440" height="145" rx="8" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.5"/>

  <!-- <aside> -->
  <rect x="745" y="145" width="205" height="200" rx="10" fill="#163c5d" stroke="#66d9ff" stroke-opacity="0.6" stroke-width="2"/>

  <!-- <footer> -->
  <rect x="250" y="360" width="700" height="50" rx="10" fill="#163c5d" stroke="#66d9ff" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Labels -->
  <g font-family="Consolas, Monaco, 'Andale Mono', monospace" font-size="14" font-weight="700">
    <!-- Header -->
    <text x="350" y="105" fill="#66d9ff" text-anchor="middle">&lt;header&gt;</text>
    
    <!-- Nav -->
    <text x="805" y="104" fill="#7cf5c4" text-anchor="middle">&lt;nav&gt; (menu)</text>
    
    <!-- Main -->
    <text x="320" y="172" fill="#66d9ff" text-anchor="middle">&lt;main&gt;</text>
    
    <!-- Article -->
    <text x="490" y="267" fill="#7cf5c4" text-anchor="middle">&lt;article&gt;</text>
    
    <!-- Aside -->
    <text x="847" y="250" fill="#66d9ff" text-anchor="middle">&lt;aside&gt;</text>
    
    <!-- Footer -->
    <text x="600" y="391" fill="#66d9ff" text-anchor="middle">&lt;footer&gt;</text>
  </g>

  <!-- Explanatory Footnotes -->
  <g font-family="Verdana, Arial, sans-serif" text-anchor="middle" fill="#b8ddf4">
    <text x="600" y="460" font-size="22" font-weight="700">Struttura di una Pagina Semantica (HTML5)</text>
    <text x="600" y="490" font-size="15">I tag semantici dividono il layout dichiarando il ruolo del contenuto a motori di ricerca e screen reader.</text>
  </g>
</svg>
