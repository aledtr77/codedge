<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Albero del DOM (DOM Tree)</title>
  <desc id="desc">Rappresentazione ad albero della struttura gerarchica di un documento HTML.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.55" stop-color="#0c263d"/>
      <stop offset="1" stop-color="#0f1d2d"/>
    </linearGradient>
    <linearGradient id="card-root" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4e79"/>
      <stop offset="1" stop-color="#0f2b48"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163c5d"/>
      <stop offset="1" stop-color="#0b2035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66d9ff"/>
      <stop offset="1" stop-color="#7cf5c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020812" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  
  <!-- Connection Lines (DOM Tree branches) -->
  <g stroke="url(#accent)" stroke-width="3" fill="none" stroke-opacity="0.6" stroke-linecap="round">
    <!-- root to html -->
    <path d="M600 90v50"/>
    <!-- html to head & body -->
    <path d="M600 170v40H300v40"/>
    <path d="M600 210h300v40"/>
    <!-- head children -->
    <path d="M300 280v40H180v30"/>
    <path d="M300 320h120v30"/>
    <!-- body children -->
    <path d="M900 280v40H720v30"/>
    <path d="M900 320v30"/>
    <path d="M900 320h180v30"/>
  </g>

  <!-- Node Cards -->
  <g filter="url(#shadow)">
    <!-- Document Root -->
    <rect x="500" y="40" width="200" height="50" rx="12" fill="url(#card-root)" stroke="#7cf5c4" stroke-opacity="0.5" stroke-width="2"/>
    
    <!-- HTML Element -->
    <rect x="500" y="140" width="200" height="50" rx="12" fill="url(#card)" stroke="#66d9ff" stroke-opacity="0.4" stroke-width="2"/>
    
    <!-- Head Element -->
    <rect x="200" y="240" width="200" height="50" rx="12" fill="url(#card)" stroke="#66d9ff" stroke-opacity="0.4"/>
    <!-- Title Element -->
    <rect x="80" y="340" width="180" height="50" rx="10" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.3"/>
    <!-- Meta Element -->
    <rect x="330" y="340" width="180" height="50" rx="10" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.3"/>

    <!-- Body Element -->
    <rect x="800" y="240" width="200" height="50" rx="12" fill="url(#card)" stroke="#66d9ff" stroke-opacity="0.4"/>
    <!-- Header Element -->
    <rect x="630" y="340" width="160" height="50" rx="10" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.3"/>
    <!-- Main Element -->
    <rect x="820" y="340" width="160" height="50" rx="10" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.3"/>
    <!-- Footer Element -->
    <rect x="1000" y="340" width="160" height="50" rx="10" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.3"/>
  </g>

  <!-- Labels -->
  <g font-family="Consolas, Monaco, 'Andale Mono', monospace" text-anchor="middle">
    <!-- Root -->
    <text x="600" y="71" fill="#f4fbff" font-size="16" font-weight="700">document</text>
    
    <!-- HTML -->
    <text x="600" y="171" fill="#7cf5c4" font-size="16" font-weight="700">&lt;html&gt;</text>
    
    <!-- Head -->
    <text x="300" y="271" fill="#66d9ff" font-size="16" font-weight="700">&lt;head&gt;</text>
    <text x="170" y="371" fill="#e2f5ff" font-size="14">&lt;title&gt;</text>
    <text x="420" y="371" fill="#e2f5ff" font-size="14">&lt;meta&gt;</text>

    <!-- Body -->
    <text x="900" y="271" fill="#66d9ff" font-size="16" font-weight="700">&lt;body&gt;</text>
    <text x="710" y="371" fill="#e2f5ff" font-size="14">&lt;header&gt;</text>
    <text x="900" y="371" fill="#e2f5ff" font-size="14">&lt;main&gt;</text>
    <text x="1080" y="371" fill="#e2f5ff" font-size="14">&lt;footer&gt;</text>
  </g>

  <!-- Explanatory Footnotes -->
  <g font-family="Verdana, Arial, sans-serif" text-anchor="middle" fill="#b8ddf4">
    <text x="600" y="445" font-size="22" font-weight="700">L'albero della struttura HTML (DOM)</text>
    <text x="600" y="475" font-size="15">Ogni tag è una scatola logica collegata ad un genitore, formando una gerarchia rigida e pulita.</text>
  </g>
</svg>
