<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CSS Box Model</title>
  <desc id="desc">Visualizzazione interattiva del Box Model: Content, Padding, Border, Margin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.55" stop-color="#0c263d"/>
      <stop offset="1" stop-color="#0f1d2d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>

  <!-- Outer Margin Box (Dasher border) -->
  <rect x="150" y="60" width="900" height="340" rx="20" fill="none" stroke="#66d9ff" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8,8"/>
  <text x="170" y="90" fill="#66d9ff" fill-opacity="0.6" font-family="Consolas, monospace" font-size="16" font-weight="700">MARGIN</text>

  <!-- Border Box (Solid line with glow) -->
  <rect x="250" y="110" width="700" height="240" rx="16" fill="#163c5d" fill-opacity="0.6" stroke="#e5c158" stroke-width="4" filter="url(#glow)"/>
  <text x="270" y="140" fill="#e5c158" font-family="Consolas, monospace" font-size="16" font-weight="700">BORDER</text>

  <!-- Padding Box -->
  <rect x="320" y="150" width="560" height="160" rx="12" fill="#0b2035" stroke="#66d9ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="340" y="180" fill="#66d9ff" font-family="Consolas, monospace" font-size="16" font-weight="700">PADDING</text>

  <!-- Content Box -->
  <rect x="390" y="190" width="420" height="80" rx="8" fill="#0e3a2f" stroke="#7cf5c4" stroke-width="2"/>
  <text x="600" y="236" fill="#7cf5c4" font-family="Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">CONTENT (Larghezza x Altezza)</text>

  <!-- Dimension arrows -->
  <!-- Margin spacer indicator -->
  <path d="M150 230h100" stroke="#66d9ff" stroke-width="2" stroke-dasharray="4,4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="200" y="220" fill="#66d9ff" font-family="Verdana" font-size="13" text-anchor="middle">spazio esterno</text>

  <!-- Padding spacer indicator -->
  <path d="M250 230h70" stroke="#66d9ff" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="285" y="220" fill="#66d9ff" font-family="Verdana" font-size="13" text-anchor="middle">interno</text>

  <!-- Footnote -->
  <g font-family="Verdana, Arial, sans-serif" text-anchor="middle" fill="#b8ddf4">
    <text x="600" y="445" font-size="22" font-weight="700">Anatomia del Box Model CSS</text>
    <text x="600" y="475" font-size="15">Ogni elemento è composto da quattro aree concentriche. La proprietà border-box include padding e border nei calcoli.</text>
  </g>
</svg>
