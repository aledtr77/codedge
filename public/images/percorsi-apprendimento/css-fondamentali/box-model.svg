<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CSS Box Model</title>
  <desc id="desc">Content, padding, border and margin shown as nested areas, with a 120px content-box and border-box width calculation.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#142134"/>
      <stop offset="1" stop-color="#0d1726"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#background)"/>
  <text x="54" y="53" fill="#e4ebf3" font-family="system-ui,sans-serif" font-size="27" font-weight="700">box model</text>
  <text x="54" y="79" fill="#aebfd1" font-family="system-ui,sans-serif" font-size="15">content / padding / border / margin</text>

  <rect x="52" y="110" width="642" height="355" rx="16" fill="#162b3d" stroke="#6f839a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="72" y="140" fill="#bac9d9" font-family="ui-monospace,monospace" font-size="18" font-weight="700">margin</text>

  <rect x="105" y="160" width="536" height="257" rx="12" fill="#aa794c"/>
  <text x="127" y="189" fill="#172130" font-family="ui-monospace,monospace" font-size="18" font-weight="700">border · 2px</text>

  <rect x="132" y="211" width="482" height="180" rx="8" fill="#3a657d"/>
  <text x="152" y="240" fill="#e7f3f9" font-family="ui-monospace,monospace" font-size="18" font-weight="700">padding · 10px</text>

  <rect x="196" y="269" width="354" height="89" rx="6" fill="#143e3b" stroke="#8fd2b8" stroke-width="2"/>
  <text x="373" y="318" fill="#bcebd8" font-family="ui-monospace,monospace" font-size="20" font-weight="700" text-anchor="middle">content</text>
  <text x="373" y="343" fill="#9dd5c2" font-family="ui-monospace,monospace" font-size="14" text-anchor="middle">width: 120px</text>

  <rect x="728" y="110" width="420" height="154" rx="12" fill="#1b3043" stroke="#57738d"/>
  <text x="754" y="148" fill="#badced" font-family="ui-monospace,monospace" font-size="19" font-weight="700">content-box</text>
  <text x="754" y="184" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="23">120 + 20 + 4</text>
  <text x="754" y="226" fill="#f4c587" font-family="ui-monospace,monospace" font-size="22" font-weight="700">= 144px</text>

  <rect x="728" y="286" width="420" height="179" rx="12" fill="#1b3043" stroke="#57738d"/>
  <text x="754" y="324" fill="#badced" font-family="ui-monospace,monospace" font-size="19" font-weight="700">border-box</text>
  <text x="754" y="360" fill="#e8eef4" font-family="ui-monospace,monospace" font-size="23">96 + 20 + 4</text>
  <text x="754" y="403" fill="#bcebd8" font-family="ui-monospace,monospace" font-size="22" font-weight="700">= 120px</text>
</svg>
