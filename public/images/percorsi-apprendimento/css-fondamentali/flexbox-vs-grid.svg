<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Flexbox vs Grid</title>
  <desc id="desc">Visualizzazione comparativa tra Flexbox (monodimensionale) e Grid (bidimensionale).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.55" stop-color="#0c263d"/>
      <stop offset="1" stop-color="#0f1d2d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163c5d"/>
      <stop offset="1" stop-color="#0b2035"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020812" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>

  <!-- Left: Flexbox (1D) -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="480" height="300" rx="18" fill="url(#card)" stroke="#66d9ff" stroke-opacity="0.4" stroke-width="2"/>
    <!-- Flex Container row -->
    <rect x="120" y="140" width="400" height="180" rx="12" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.3" stroke-width="2"/>
    <!-- Flex Items -->
    <rect x="140" y="170" width="90" height="120" rx="8" fill="#1e4e79" stroke="#66d9ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="185" y="235" fill="#f4fbff" font-family="Consolas, monospace" font-size="16" text-anchor="middle">Item 1</text>
    
    <rect x="250" y="170" width="140" height="120" rx="8" fill="#1e4e79" stroke="#66d9ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="320" y="235" fill="#f4fbff" font-family="Consolas, monospace" font-size="16" text-anchor="middle">Item 2 (largo)</text>

    <rect x="410" y="170" width="90" height="120" rx="8" fill="#1e4e79" stroke="#66d9ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="455" y="235" fill="#f4fbff" font-family="Consolas, monospace" font-size="16" text-anchor="middle">Item 3</text>

    <!-- Axis arrow -->
    <path d="M120 110h400" stroke="#7cf5c4" stroke-width="3" stroke-linecap="round"/>
    <path d="M510 102l10 8-10 8" stroke="#7cf5c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="320" y="95" fill="#7cf5c4" font-family="Verdana" font-size="14" font-weight="700" text-anchor="middle">Asse Principale (1D)</text>
  </g>

  <!-- Right: Grid (2D) -->
  <g filter="url(#shadow)">
    <rect x="640" y="80" width="480" height="300" rx="18" fill="url(#card)" stroke="#66d9ff" stroke-opacity="0.4" stroke-width="2"/>
    <!-- Grid Container (2D) -->
    <rect x="680" y="140" width="400" height="180" rx="12" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Grid Cells -->
    <rect x="695" y="155" width="110" height="70" rx="6" fill="#1e4e79" stroke="#e5c158" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="825" y="155" width="110" height="70" rx="6" fill="#1e4e79" stroke="#e5c158" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="955" y="155" width="110" height="70" rx="6" fill="#1e4e79" stroke="#e5c158" stroke-opacity="0.5" stroke-width="2"/>

    <rect x="695" y="235" width="110" height="70" rx="6" fill="#1e4e79" stroke="#e5c158" stroke-opacity="0.5" stroke-width="2"/>
    <!-- Item spanning 2 columns -->
    <rect x="825" y="235" width="240" height="70" rx="6" fill="#0e3a2f" stroke="#7cf5c4" stroke-opacity="0.8" stroke-width="2"/>
    <text x="945" y="278" fill="#7cf5c4" font-family="Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">Span 2 colonne</text>

    <!-- Axes indicators -->
    <!-- X Axis -->
    <path d="M680 110h400" stroke="#7cf5c4" stroke-width="3" stroke-linecap="round"/>
    <path d="M1070 102l10 8-10 8" stroke="#7cf5c4" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Y Axis -->
    <path d="M1140 140v180" stroke="#66d9ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M1132 310l8 10 8-10" stroke="#66d9ff" stroke-width="3" stroke-linecap="round" fill="none"/>

    <text x="880" y="95" fill="#7cf5c4" font-family="Verdana" font-size="14" font-weight="700" text-anchor="middle">Righe (Asse X)</text>
    <text x="1155" y="235" fill="#66d9ff" font-family="Verdana" font-size="14" font-weight="700" transform="rotate(90,1155,235)" text-anchor="middle">Colonne (Asse Y)</text>
  </g>

  <!-- Titles and explanations -->
  <g font-family="Verdana, Arial, sans-serif" text-anchor="middle">
    <!-- Left Footer -->
    <text x="320" y="445" fill="#66d9ff" font-size="20" font-weight="700">FLEXBOX (Monodimensionale)</text>
    <text x="320" y="475" fill="#bfeaff" font-size="14">Allinea elementi lungo una singola riga o colonna.</text>

    <!-- Right Footer -->
    <text x="880" y="445" fill="#7cf5c4" font-size="20" font-weight="700">GRID (Bidimensionale)</text>
    <text x="880" y="475" fill="#bfeaff" font-size="14">Dispone elementi su una griglia di righe e colonne parallele.</text>
  </g>
</svg>
