<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Panoramica Browser e DevTools</title>
  <desc id="desc">Schema dei pannelli principali delle DevTools: Elements, Console, Sources, Network, Performance, Application, Memory e Lighthouse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c2d"/>
      <stop offset="0.55" stop-color="#132d46"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4668"/>
      <stop offset="1" stop-color="#0d1c2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="110" r="170" fill="#00a8ff" opacity="0.09"/>
  <circle cx="170" cy="430" r="150" fill="#7bd7ff" opacity="0.08"/>

  <text x="56" y="72" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700">Browser e DevTools</text>
  <text x="58" y="110" fill="#b9dcf4" font-family="Verdana, Arial, sans-serif" font-size="17">Una pagina diventa leggibile quando separi struttura, stile, script, rete, dati locali e prestazioni.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="148" width="1060" height="298" rx="24" fill="#071321" stroke="#5fbfff" stroke-opacity="0.28"/>
    <rect x="70" y="148" width="1060" height="46" rx="24" fill="#0d2236"/>
    <circle cx="103" cy="171" r="7" fill="#ff7e7e"/>
    <circle cx="128" cy="171" r="7" fill="#ffd166"/>
    <circle cx="153" cy="171" r="7" fill="#61d394"/>
    <rect x="198" y="160" width="420" height="22" rx="11" fill="#122f49" stroke="#74cfff" stroke-opacity="0.18"/>
    <text x="218" y="176" fill="#d8efff" font-family="Consolas, monospace" font-size="13">codedge.it/tutorial/browser-devtools/</text>

    <rect x="98" y="222" width="222" height="172" rx="18" fill="url(#panel)" stroke="#80d4ff" stroke-opacity="0.32"/>
    <text x="124" y="268" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="25" font-weight="700">Elements</text>
    <text x="124" y="305" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">DOM reale</text>
    <text x="124" y="332" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">CSS applicato</text>
    <text x="124" y="359" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">Box model</text>

    <rect x="354" y="222" width="222" height="172" rx="18" fill="url(#panel)" stroke="#80d4ff" stroke-opacity="0.32"/>
    <text x="380" y="268" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="25" font-weight="700">Console</text>
    <text x="380" y="305" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">Errori JS</text>
    <text x="380" y="332" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">Warning</text>
    <text x="380" y="359" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">Prove rapide</text>

    <rect x="610" y="222" width="222" height="172" rx="18" fill="url(#panel)" stroke="#80d4ff" stroke-opacity="0.32"/>
    <text x="636" y="268" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="25" font-weight="700">Network</text>
    <text x="636" y="305" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">Asset caricati</text>
    <text x="636" y="332" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">API e JSON</text>
    <text x="636" y="359" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">Status code</text>

    <rect x="866" y="222" width="222" height="172" rx="18" fill="url(#panel)" stroke="#80d4ff" stroke-opacity="0.32"/>
    <text x="892" y="268" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="25" font-weight="700">Application</text>
    <text x="892" y="305" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">Storage</text>
    <text x="892" y="332" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">Cookie</text>
    <text x="892" y="359" fill="#c4e5fa" font-family="Verdana, Arial, sans-serif" font-size="16">Cache</text>
  </g>

  <g font-family="Verdana, Arial, sans-serif" font-size="14" fill="#d8efff">
    <rect x="142" y="410" width="916" height="42" rx="21" fill="#0b1d30" stroke="#5fbfff" stroke-opacity="0.25"/>
    <text x="178" y="436" fill="#8bd8ff" font-weight="700">Altri pannelli utili:</text>
    <text x="346" y="436">Sources</text>
    <circle cx="425" cy="431" r="4" fill="#8bd8ff"/>
    <text x="448" y="436">Performance</text>
    <circle cx="565" cy="431" r="4" fill="#8bd8ff"/>
    <text x="588" y="436">Memory</text>
    <circle cx="664" cy="431" r="4" fill="#8bd8ff"/>
    <text x="687" y="436">Lighthouse</text>
  </g>
</svg>
