<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Panoramica SEO tecnica base</title>
  <desc id="desc">Schema dei passaggi principali: contenuto, crawl, indicizzazione, risultato e controllo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07192b"/>
      <stop offset="0.55" stop-color="#0c263d"/>
      <stop offset="1" stop-color="#0f1d2d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163c5d"/>
      <stop offset="1" stop-color="#0b2035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66d9ff"/>
      <stop offset="1" stop-color="#7cf5c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020812" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <path d="M84 100h1032M84 420h1032" stroke="#78cfff" stroke-opacity="0.12" stroke-width="1"/>
  <path d="M120 260c110-120 240-120 360 0s250 120 360 0 190-120 260 0" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.55"/>

  <g filter="url(#shadow)">
    <rect x="74" y="138" width="190" height="212" rx="18" fill="url(#card)" stroke="#77d5ff" stroke-opacity="0.35"/>
    <rect x="318" y="138" width="190" height="212" rx="18" fill="url(#card)" stroke="#77d5ff" stroke-opacity="0.35"/>
    <rect x="562" y="138" width="190" height="212" rx="18" fill="url(#card)" stroke="#77d5ff" stroke-opacity="0.35"/>
    <rect x="806" y="138" width="190" height="212" rx="18" fill="url(#card)" stroke="#77d5ff" stroke-opacity="0.35"/>
    <rect x="1018" y="178" width="110" height="132" rx="18" fill="#0b2035" stroke="#7cf5c4" stroke-opacity="0.42"/>
  </g>

  <g fill="none" stroke="#9ce4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M146 208h46M146 232h78M146 256h64M146 280h92"/>
    <path d="M380 208c24-24 68-24 92 0M380 248c24-24 68-24 92 0M380 288c24-24 68-24 92 0"/>
    <path d="M632 204h50v86h-50zM694 224h22M694 248h28M694 272h18"/>
    <path d="M864 206h74M864 238h96M864 270h58"/>
    <circle cx="1073" cy="244" r="34"/>
    <path d="M1098 269l24 24"/>
  </g>

  <g font-family="Verdana, Arial, sans-serif">
    <text x="169" y="176" text-anchor="middle" fill="#f4fbff" font-size="24" font-weight="700">Pagina</text>
    <text x="169" y="382" text-anchor="middle" fill="#bfeaff" font-size="17">contenuto utile</text>
    <text x="169" y="406" text-anchor="middle" fill="#bfeaff" font-size="17">HTML leggibile</text>

    <text x="413" y="176" text-anchor="middle" fill="#f4fbff" font-size="24" font-weight="700">Crawl</text>
    <text x="413" y="382" text-anchor="middle" fill="#bfeaff" font-size="17">link raggiungibili</text>
    <text x="413" y="406" text-anchor="middle" fill="#bfeaff" font-size="17">risorse accessibili</text>

    <text x="657" y="176" text-anchor="middle" fill="#f4fbff" font-size="24" font-weight="700">Indice</text>
    <text x="657" y="382" text-anchor="middle" fill="#bfeaff" font-size="17">URL canonico</text>
    <text x="657" y="406" text-anchor="middle" fill="#bfeaff" font-size="17">segnali coerenti</text>

    <text x="901" y="176" text-anchor="middle" fill="#f4fbff" font-size="24" font-weight="700">Risultato</text>
    <text x="901" y="382" text-anchor="middle" fill="#bfeaff" font-size="17">title, snippet</text>
    <text x="901" y="406" text-anchor="middle" fill="#bfeaff" font-size="17">anteprima social</text>

    <text x="1073" y="334" text-anchor="middle" fill="#d8fff0" font-size="17" font-weight="700">GSC</text>
    <text x="600" y="70" text-anchor="middle" fill="#f5fbff" font-size="34" font-weight="700">SEO tecnica base</text>
    <text x="600" y="462" text-anchor="middle" fill="#b8ddf4" font-size="18">La SEO non forza Google: rende piu chiaro cosa pubblici, dove si trova e perche dovrebbe essere utile.</text>
  </g>

  <g fill="none" stroke="#7cf5c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M274 244h34"/>
    <path d="M300 236l9 8-9 8"/>
    <path d="M518 244h34"/>
    <path d="M544 236l9 8-9 8"/>
    <path d="M762 244h34"/>
    <path d="M788 236l9 8-9 8"/>
    <path d="M1006 244h16"/>
    <path d="M1014 236l9 8-9 8"/>
  </g>
</svg>
