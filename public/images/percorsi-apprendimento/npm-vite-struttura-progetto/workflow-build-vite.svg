<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Workflow build locale con Vite</title>
  <desc id="desc">Schema che mostra sorgenti, script npm, vite build, cartella dist e preview o deploy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="0.58" stop-color="#1b344d"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#244763"/>
      <stop offset="1" stop-color="#0c1b2e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10Z" fill="#8bd8ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000814" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="150" fill="#cb3837" opacity="0.09"/>
  <circle cx="130" cy="430" r="120" fill="#8bd8ff" opacity="0.08"/>

  <text x="56" y="72" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700">Build locale con Vite</text>
  <text x="58" y="110" fill="#bdddf2" font-family="Verdana, Arial, sans-serif" font-size="17">La build non è una copia: è il risultato preparato dagli strumenti.</text>

  <g filter="url(#shadow)">
    <rect x="84" y="190" width="190" height="138" rx="20" fill="url(#card)" stroke="#8bd8ff" stroke-opacity="0.34"/>
    <text x="124" y="245" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="25" font-weight="700">Sorgenti</text>
    <text x="124" y="282" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="16">src, pages, public</text>

    <rect x="344" y="190" width="190" height="138" rx="20" fill="url(#card)" stroke="#ff8b8b" stroke-opacity="0.35"/>
    <text x="384" y="245" fill="#fff4f4" font-family="Verdana, Arial, sans-serif" font-size="25" font-weight="700">Script</text>
    <text x="384" y="282" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="16">npm run build</text>

    <rect x="604" y="190" width="190" height="138" rx="20" fill="url(#card)" stroke="#8bd8ff" stroke-opacity="0.34"/>
    <text x="644" y="245" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="25" font-weight="700">Vite</text>
    <text x="644" y="282" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="16">ottimizza asset</text>

    <rect x="864" y="190" width="240" height="138" rx="20" fill="url(#card)" stroke="#8bd8ff" stroke-opacity="0.34"/>
    <text x="904" y="245" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="25" font-weight="700">dist</text>
    <text x="904" y="282" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="16">preview o deploy</text>
  </g>

  <path d="M288 258H328" stroke="#8bd8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M548 258H588" stroke="#8bd8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M808 258H848" stroke="#8bd8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g font-family="Verdana, Arial, sans-serif" font-size="15" fill="#d8efff">
    <rect x="148" y="374" width="904" height="56" rx="18" fill="#071321" stroke="#5fbfff" stroke-opacity="0.24"/>
    <text x="182" y="408">Controlla sempre la build locale: se qui fallisce, online quasi sicuramente fallirà nello stesso punto.</text>
  </g>
</svg>
