<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Panoramica NPM Vite e struttura progetto</title>
  <desc id="desc">Schema che collega package json, npm install, vite dev, vite build e cartella dist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121827"/>
      <stop offset="0.55" stop-color="#1d3146"/>
      <stop offset="1" stop-color="#0a111d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4660"/>
      <stop offset="1" stop-color="#0d1b2b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10Z" fill="#8bd8ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000814" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="170" fill="#cb3837" opacity="0.09"/>
  <circle cx="160" cy="430" r="150" fill="#8bd8ff" opacity="0.08"/>

  <text x="56" y="72" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700">NPM, Vite e struttura progetto</text>
  <text x="58" y="110" fill="#bdddf2" font-family="Verdana, Arial, sans-serif" font-size="17">Dai sorgenti alla build: dipendenze, script, dev server e cartella finale.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="154" width="1060" height="292" rx="24" fill="#071321" stroke="#5fbfff" stroke-opacity="0.25"/>
    <rect x="104" y="210" width="190" height="130" rx="18" fill="url(#panel)" stroke="#ff8b8b" stroke-opacity="0.32"/>
    <text x="132" y="254" fill="#fff4f4" font-family="Verdana, Arial, sans-serif" font-size="23" font-weight="700">package.json</text>
    <text x="132" y="290" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="15">script</text>
    <text x="132" y="316" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="15">dipendenze</text>

    <rect x="370" y="210" width="170" height="130" rx="18" fill="url(#panel)" stroke="#8bd8ff" stroke-opacity="0.32"/>
    <text x="402" y="254" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="23" font-weight="700">NPM</text>
    <text x="402" y="290" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="15">install</text>
    <text x="402" y="316" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="15">run scripts</text>

    <rect x="616" y="210" width="170" height="130" rx="18" fill="url(#panel)" stroke="#8bd8ff" stroke-opacity="0.32"/>
    <text x="648" y="254" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="23" font-weight="700">Vite</text>
    <text x="648" y="290" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="15">dev server</text>
    <text x="648" y="316" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="15">build</text>

    <rect x="862" y="210" width="230" height="130" rx="18" fill="url(#panel)" stroke="#8bd8ff" stroke-opacity="0.32"/>
    <text x="898" y="254" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="23" font-weight="700">Output</text>
    <text x="898" y="290" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="15">browser in locale</text>
    <text x="898" y="316" fill="#dceeff" font-family="Verdana, Arial, sans-serif" font-size="15">dist per deploy</text>
  </g>

  <path d="M308 275H354" stroke="#8bd8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M554 275H600" stroke="#8bd8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M800 275H846" stroke="#8bd8ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g font-family="Consolas, monospace" font-size="15" fill="#d8efff">
    <rect x="160" y="378" width="880" height="42" rx="21" fill="#0b1d30" stroke="#5fbfff" stroke-opacity="0.23"/>
    <text x="198" y="404">npm install  ->  npm run dev  ->  npm run build  ->  npm run preview</text>
  </g>
</svg>
