<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Working tree di un progetto NPM e Vite</title>
  <desc id="desc">Schema di una cartella progetto con file tracciati, file locali, cartelle ignorate e output generato.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.56" stop-color="#1c3148"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#203f5c"/>
      <stop offset="1" stop-color="#0b1a2b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000814" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1035" cy="112" r="165" fill="#cb3837" opacity="0.09"/>
  <circle cx="150" cy="430" r="145" fill="#8bd8ff" opacity="0.08"/>

  <text x="56" y="72" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700">Working tree</text>
  <text x="58" y="110" fill="#bdddf2" font-family="Verdana, Arial, sans-serif" font-size="17">La cartella reale del progetto: file tracciati, modifiche locali, cartelle ignorate e output generato.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="146" width="1060" height="312" rx="24" fill="#071321" stroke="#5fbfff" stroke-opacity="0.25"/>
    <rect x="104" y="184" width="410" height="236" rx="18" fill="url(#panel)" stroke="#8bd8ff" stroke-opacity="0.3"/>
    <text x="132" y="226" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="700">01-codedge/</text>
    <g font-family="Consolas, monospace" font-size="17" fill="#dceeff">
      <text x="146" y="268">├─ package.json</text>
      <text x="146" y="298">├─ package-lock.json</text>
      <text x="146" y="328">├─ src/</text>
      <text x="146" y="358">├─ pages/</text>
      <text x="146" y="388">├─ public/</text>
    </g>
    <rect x="552" y="184" width="250" height="96" rx="18" fill="#0d2438" stroke="#80d4ff" stroke-opacity="0.28"/>
    <text x="582" y="224" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700">Tracciati da Git</text>
    <text x="582" y="254" fill="#cfe7f8" font-family="Verdana, Arial, sans-serif" font-size="15">sorgenti e configurazioni</text>

    <rect x="552" y="306" width="250" height="96" rx="18" fill="#251f1f" stroke="#ff8b8b" stroke-opacity="0.28"/>
    <text x="582" y="346" fill="#fff4f4" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700">Modifiche locali</text>
    <text x="582" y="376" fill="#f5d5d5" font-family="Verdana, Arial, sans-serif" font-size="15">file editati o nuovi</text>

    <rect x="842" y="184" width="230" height="96" rx="18" fill="#102236" stroke="#8bd8ff" stroke-opacity="0.26"/>
    <text x="872" y="224" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700">Ignorati</text>
    <text x="872" y="254" fill="#cfe7f8" font-family="Consolas, monospace" font-size="15">node_modules/</text>

    <rect x="842" y="306" width="230" height="96" rx="18" fill="#102236" stroke="#8bd8ff" stroke-opacity="0.26"/>
    <text x="872" y="346" fill="#eef8ff" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700">Generati</text>
    <text x="872" y="376" fill="#cfe7f8" font-family="Consolas, monospace" font-size="15">dist/</text>
  </g>

  <g font-family="Verdana, Arial, sans-serif" font-size="15" fill="#d8efff">
    <rect x="190" y="446" width="820" height="42" rx="21" fill="#0b1d30" stroke="#5fbfff" stroke-opacity="0.23"/>
    <text x="228" y="472">Git osserva il working tree; NPM installa dipendenze; Vite legge sorgenti e produce la build.</text>
  </g>
</svg>
