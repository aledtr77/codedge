<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" lang="en"><title id="title">Compare matching observation windows</title><desc id="desc">Cohorts of ten users. A: six at week one, four at week two. B: eight at week one, week two not observed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66d9ff" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" fill="#101923"/><g font-family="Inter, Arial, sans-serif"><text x="48" y="70" fill="#edf3f8" font-size="36" font-weight="700">Compare matching observation windows</text><text x="48" y="116" fill="#f3cc79" font-size="24" font-weight="400">Learning example · simulated data</text><rect x="48" y="168" width="1104" height="266" rx="10" fill="#162431" stroke="#3b5365"/><path d="M48 250 L1152 250" stroke="#66d9ff" stroke-width="2" fill="none"/><path d="M48 342 L1152 342" stroke="#66d9ff" stroke-width="2" fill="none"/><path d="M230 168 L230 434" stroke="#66d9ff" stroke-width="2" fill="none"/><path d="M420 168 L420 434" stroke="#66d9ff" stroke-width="2" fill="none"/><path d="M700 168 L700 434" stroke="#66d9ff" stroke-width="2" fill="none"/><text x="74" y="222" fill="#b8c8d6" font-size="24" font-weight="600">Cohort</text><text x="258" y="222" fill="#b8c8d6" font-size="24" font-weight="600">Start</text><text x="450" y="222" fill="#b8c8d6" font-size="24" font-weight="600">Week 1</text><text x="730" y="222" fill="#b8c8d6" font-size="24" font-weight="600">Week 2</text><text x="74" y="308" fill="#edf3f8" font-size="28" font-weight="400">A</text><text x="258" y="308" fill="#edf3f8" font-size="28" font-weight="400">10</text><text x="450" y="308" fill="#edf3f8" font-size="28" font-weight="400">6 (60%)</text><text x="730" y="308" fill="#edf3f8" font-size="28" font-weight="400">4 (40%)</text><text x="74" y="398" fill="#edf3f8" font-size="28" font-weight="400">B</text><text x="258" y="398" fill="#edf3f8" font-size="28" font-weight="400">10</text><text x="450" y="398" fill="#edf3f8" font-size="28" font-weight="400">8 (80%)</text><text x="730" y="398" fill="#f3cc79" font-size="24" font-weight="400">Not yet observed</text><text x="48" y="503" fill="#edf3f8" font-size="26" font-weight="400">Compare A and B at the same point after starting.</text><text x="48" y="550" fill="#b8c8d6" font-size="24" font-weight="400">An incomplete window does not mean zero users.</text></g></svg>