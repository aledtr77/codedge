<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" lang="it"><title id="title">Ogni prova porta a una decisione</title><desc id="desc">Ipotesi, prova, risultato e decisione: continua, cambia o ferma. Cambiare porta a una nuova ipotesi.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66d9ff" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" fill="#101923"/><g font-family="Inter, Arial, sans-serif"><text x="48" y="70" fill="#edf3f8" font-size="36" font-weight="700">Ogni prova porta a una decisione</text><text x="48" y="116" fill="#b8c8d6" font-size="24" font-weight="400">Scrivi prima cosa vuoi imparare e come userai il risultato.</text><rect x="48" y="192" width="234" height="140" rx="10" fill="#162431" stroke="#3b5365"/><text x="68" y="244" fill="#edf3f8" font-size="28" font-weight="700">Ipotesi</text><text x="68" y="294" fill="#b8c8d6" font-size="24" font-weight="400">Cosa ti aspetti?</text><path d="M290 262 L326 262" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="338" y="192" width="234" height="140" rx="10" fill="#162431" stroke="#3b5365"/><text x="358" y="244" fill="#edf3f8" font-size="28" font-weight="700">Prova</text><text x="358" y="294" fill="#b8c8d6" font-size="24" font-weight="400">Come verifichi?</text><path d="M580 262 L616 262" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="628" y="192" width="234" height="140" rx="10" fill="#162431" stroke="#3b5365"/><text x="648" y="244" fill="#edf3f8" font-size="28" font-weight="700">Risultato</text><text x="648" y="294" fill="#b8c8d6" font-size="24" font-weight="400">Cosa osservi?</text><path d="M870 262 L906 262" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="918" y="192" width="234" height="140" rx="10" fill="#162431" stroke="#3b5365"/><text x="938" y="244" fill="#edf3f8" font-size="28" font-weight="700">Decisione</text><text x="938" y="294" fill="#b8c8d6" font-size="24" font-weight="400">Cosa fai ora?</text><path d="M1035 332 L1035 390" stroke="#66d9ff" stroke-width="2" fill="none"/><path d="M710 390 L1070 390" stroke="#66d9ff" stroke-width="2" fill="none"/><path d="M710 390 L710 444" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="630" y="450" width="160" height="68" rx="10" fill="#162431" stroke="#3b5365"/><text x="650" y="493" fill="#edf3f8" font-size="26" font-weight="600">Continua</text><path d="M890 390 L890 444" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="810" y="450" width="160" height="68" rx="10" fill="#162431" stroke="#3b5365"/><text x="830" y="493" fill="#edf3f8" font-size="26" font-weight="600">Cambia</text><path d="M1070 390 L1070 444" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="990" y="450" width="160" height="68" rx="10" fill="#162431" stroke="#3b5365"/><text x="1010" y="493" fill="#edf3f8" font-size="26" font-weight="600">Ferma</text><path d="M890 518 V580 H165 V344" fill="none" stroke="#66d9ff" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="355" y="554" width="250" height="48" rx="10" fill="#101923" stroke="#3b5365"/><text x="376" y="586" fill="#66d9ff" font-size="24" font-weight="400">Nuova ipotesi</text></g></svg>