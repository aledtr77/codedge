<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" lang="en"><title id="title">How much does a signal tell you?</title><desc id="desc">Qualitative commitment ladder: compliment, test on real work and paid pilot. Not a probability or guarantee of demand.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66d9ff" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" fill="#101923"/><g font-family="Inter, Arial, sans-serif"><text x="48" y="70" fill="#edf3f8" font-size="36" font-weight="700">How much does a signal tell you?</text><text x="48" y="116" fill="#b8c8d6" font-size="24" font-weight="400">Look at what a person is willing to commit.</text><rect x="48" y="174" width="344" height="224" rx="10" fill="#162431" stroke="#3b5365"/><text x="72" y="222" fill="#66d9ff" font-size="24" font-weight="700">01</text><text x="72" y="282" fill="#edf3f8" font-size="26" font-weight="700">Compliment</text><text x="72" y="336" fill="#b8c8d6" font-size="24" font-weight="400">Opinion</text><path d="M398 280 L420 280" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="428" y="174" width="344" height="224" rx="10" fill="#162431" stroke="#3b5365"/><text x="452" y="222" fill="#66d9ff" font-size="24" font-weight="700">02</text><text x="452" y="282" fill="#edf3f8" font-size="26" font-weight="700">Test on real work</text><text x="452" y="336" fill="#b8c8d6" font-size="24" font-weight="400">Time and effort</text><path d="M778 280 L800 280" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="808" y="174" width="344" height="224" rx="10" fill="#162431" stroke="#3b5365"/><text x="832" y="222" fill="#66d9ff" font-size="24" font-weight="700">03</text><text x="832" y="282" fill="#edf3f8" font-size="26" font-weight="700">Paid pilot</text><text x="832" y="336" fill="#b8c8d6" font-size="24" font-weight="400">Purchase decision</text><path d="M48 446 L1152 446" stroke="#66d9ff" stroke-width="2" fill="none"/><text x="48" y="500" fill="#edf3f8" font-size="26" font-weight="600">More commitment, more information.</text><text x="48" y="546" fill="#b8c8d6" font-size="24" font-weight="400">No signal guarantees a market.</text></g></svg>