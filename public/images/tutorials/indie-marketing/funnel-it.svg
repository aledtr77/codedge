<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" lang="it"><title id="title">Dove si interrompe il percorso?</title><desc id="desc">200 visite pertinenti, 20 account, 8 primi risultati, 2 clienti. Tutte le cifre sono simulate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66d9ff" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" fill="#101923"/><g font-family="Inter, Arial, sans-serif"><text x="48" y="70" fill="#edf3f8" font-size="36" font-weight="700">Dove si interrompe il percorso?</text><text x="48" y="116" fill="#f3cc79" font-size="24" font-weight="400">Esempio didattico · dati simulati</text><rect x="48" y="184" width="204" height="218" rx="10" fill="#162431" stroke="#3b5365"/><text x="72" y="265" fill="#66d9ff" font-size="60" font-weight="700">200</text><text x="72" y="335" fill="#edf3f8" font-size="24" font-weight="600">Visite</text><path d="M263 285 L334 285" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="272" y="242" fill="#edf3f8" font-size="24" font-weight="400">10%</text><rect x="348" y="184" width="204" height="218" rx="10" fill="#162431" stroke="#3b5365"/><text x="372" y="265" fill="#66d9ff" font-size="60" font-weight="700">20</text><text x="372" y="335" fill="#edf3f8" font-size="24" font-weight="600">Account</text><path d="M563 285 L634 285" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="572" y="242" fill="#edf3f8" font-size="24" font-weight="400">40%</text><rect x="648" y="184" width="204" height="218" rx="10" fill="#162431" stroke="#3b5365"/><text x="672" y="265" fill="#66d9ff" font-size="60" font-weight="700">8</text><text x="672" y="335" fill="#edf3f8" font-size="24" font-weight="600">Primo risultato</text><path d="M863 285 L934 285" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="872" y="242" fill="#edf3f8" font-size="24" font-weight="400">25%</text><rect x="948" y="184" width="204" height="218" rx="10" fill="#162431" stroke="#3b5365"/><text x="972" y="265" fill="#66d9ff" font-size="60" font-weight="700">2</text><text x="972" y="335" fill="#edf3f8" font-size="24" font-weight="600">Clienti</text><rect x="48" y="452" width="1104" height="100" rx="10" fill="#162431" stroke="#3b5365"/><text x="76" y="513" fill="#edf3f8" font-size="28" font-weight="400">Da visita pertinente a cliente</text><text x="888" y="513" fill="#f3cc79" font-size="30" font-weight="700">2 / 200 = 1%</text></g></svg>