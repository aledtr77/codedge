<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" lang="it"><title id="title">Quanto pesa un segnale?</title><desc id="desc">Scala qualitativa dell’impegno: complimento, prova su un lavoro reale e pilota pagato. Non rappresenta probabilità o garanzie di domanda.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66d9ff" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" fill="#101923"/><g font-family="Inter, Arial, sans-serif"><text x="48" y="70" fill="#edf3f8" font-size="36" font-weight="700">Quanto pesa un segnale?</text><text x="48" y="116" fill="#b8c8d6" font-size="24" font-weight="400">Osserva ciò che una persona è disposta a impegnare.</text><rect x="48" y="174" width="344" height="224" rx="10" fill="#162431" stroke="#3b5365"/><text x="72" y="222" fill="#66d9ff" font-size="24" font-weight="700">01</text><text x="72" y="282" fill="#edf3f8" font-size="26" font-weight="700">Complimento</text><text x="72" y="336" fill="#b8c8d6" font-size="24" font-weight="400">Opinione</text><path d="M398 280 L420 280" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="428" y="174" width="344" height="224" rx="10" fill="#162431" stroke="#3b5365"/><text x="452" y="222" fill="#66d9ff" font-size="24" font-weight="700">02</text><text x="452" y="282" fill="#edf3f8" font-size="26" font-weight="700">Prova sul lavoro reale</text><text x="452" y="336" fill="#b8c8d6" font-size="24" font-weight="400">Tempo e impegno</text><path d="M778 280 L800 280" stroke="#66d9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="808" y="174" width="344" height="224" rx="10" fill="#162431" stroke="#3b5365"/><text x="832" y="222" fill="#66d9ff" font-size="24" font-weight="700">03</text><text x="832" y="282" fill="#edf3f8" font-size="26" font-weight="700">Pilota pagato</text><text x="832" y="336" fill="#b8c8d6" font-size="24" font-weight="400">Decisione di acquisto</text><path d="M48 446 L1152 446" stroke="#66d9ff" stroke-width="2" fill="none"/><text x="48" y="500" fill="#edf3f8" font-size="26" font-weight="600">Più impegno, più informazione.</text><text x="48" y="546" fill="#b8c8d6" font-size="24" font-weight="400">Nessun segnale garantisce un mercato.</text></g></svg>